{% extends "base_admin.html" %}
{% block content %}

<div class="add_product_form">
  <h1>Add Products</h1>
   {% if error %}
     <p class="error">{{ error }}</p>
  {% endif %}
   {% if success %}
     <p class="success">{{ success }}</p>
  {% endif %}
  <form method="POST" enctype="multipart/form-data">
    <div class="form_row"> 
      <div class="form_field"> 
        <label for="name">Name:</label> 
        <input name="name" id="name"/><br />
      </div>
      <div class="form_field">
        <label for="price">Price:</label>
        <input name="price" id="price" /><br />
      </div>  
    </div>
    <div class="form_row">
      <div class="form_field">
        <label for="category">Category:</label> 
        <input name="category" id="category"/><br />
      </div>
      <div class="form_field">
        <label for="subcategory">Subcategory:</label> 
        <input name="subcategory" id="subcategory" /><br />
      </div>
    </div>
    <div id="variant_rows">
    <div class="form_row">
      <div class="form_field">
        <label for="sizes">Sizes:</label> 
        <input name="size[]" id="sizes" /> 
      </div>
      <div class="form_field">
        <label for="colors">Colors:</label> 
        <input name="color[]" id="colors" /><br />
      </div>
    </div>
    </div>
    <button type="button" id="add_variant_btn">Add Variant</button>
    <div id="image_row">
    <div class="form_row">
      <label for="images">Image URL:</label>
      <input type="file" name="image_file[]" id="images"/><br />
    </div>
    </div>
    <button type="button" id="add_image_btn">Add Image</button>
    <div class="form_row">
      <label for="description">Description:</label> 
      <textarea type="text" name="description" id="description"></textarea><br />
    </div>
    <button type="submit">Add Product</button>
  </form>
</div>   
  {% endblock %}
