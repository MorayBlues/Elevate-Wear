{% extends "base_admin.html" %}

{% block content %}
    {% for product in products %}

    <div class="product_cards">
      <div class="card_info">
        <div class="product">
          <p>Name: {{ product[1] }}</p>
          <p>Price: {{ product[2] }}</p>
          <p>Category: {{ product[3] }}</p>
          <p>Subcategory: {{ product[4] }}</p>
          <img src="{{ product[5] }}" alt="{{ product[1] }}" />
          <div class="btn">
          <a href="/admin/products/{{ product[0] }}/edit">Edit</a>
          </div>
          <form action="/admin/products/{{ product[0] }}" method="post">
          <button type="submit">Delete</button>
          </form>
        </div>
      </div>
    </div>

    {% endfor %}
  {% endblock %}
