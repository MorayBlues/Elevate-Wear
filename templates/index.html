{% extends "base_customer.html" %}

{% block content %}
    <div class="hero_banner">
      <div class="brand_name">
        <h1>Thread & Sole</h1>
        <div class="tagline">
          <h3>Wear Your Style</h3>
        </div>
        <div class="btn">
          <a href="/products">Shop Now</a>
        </div>
      </div>
    </div>

    <div class="featured_products">
      {% for product in featured_products %}
      <div class="product_cards">
        <div class="card_info">
          <div class="product">
            <p>Name:{{ product[1] }}</p>
            <p>Price:{{ product[2] }}</p>
            <p>Category:{{ product[3] }}</p>
            <p>Subcategory:{{ product[4] }}</p>
            <img src="{{ product[5] }}" alt="{{ product[1] }}" />
            <a href="/products/{{ product[0] }}">View Details</a>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  {% endblock %}
